# .github/workflows/build.yml
#
# Builds the JCA dual-camera debug APK on every push/PR.
# Also auto-patches the ui:components:capture module so the Compose
# Material Icons (Icons.Outlined.Duo / GridView / PictureInPicture / VideoFile)
# used in DualCameraComponents.kt actually resolve at compile time.

name: Build JCA Debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # ── Gradle cache ────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # ── Fix: missing Compose Material Icons dependency ────────────────────────
      # Root cause of the "Unresolved reference 'icons'/'Icons'" errors:
      # ui/components/capture module never declares the material-icons libs.
      - name: Patch missing material-icons dependency
        run: |
          set -e
          GRADLE_FILE=""
          for candidate in \
            "ui/components/capture/build.gradle.kts" \
            "ui/components/capture/build.gradle"; do
            if [ -f "$candidate" ]; then
              GRADLE_FILE="$candidate"
              break
            fi
          done

          if [ -z "$GRADLE_FILE" ]; then
            echo "::warning::ui/components/capture/build.gradle(.kts) not found, skipping icon dependency patch"
          elif grep -q "material-icons-extended" "$GRADLE_FILE"; then
            echo "material-icons-extended already present in $GRADLE_FILE, skipping"
          else
            awk '
              /^dependencies[[:space:]]*\{/ && !done {
                print
                print "    implementation(\"androidx.compose.material:material-icons-core\")"
                print "    implementation(\"androidx.compose.material:material-icons-extended\")"
                done = 1
                next
              }
              { print }
            ' "$GRADLE_FILE" > "$GRADLE_FILE.tmp" && mv "$GRADLE_FILE.tmp" "$GRADLE_FILE"
            echo "Patched $GRADLE_FILE with material-icons dependencies"
          fi

      # ── Spotless format check (mirrors PR gate) ──────────────────────────────
      - name: Check code formatting
        run: ./gradlew spotlessCheck --init-script gradle/init.gradle.kts --no-daemon

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build stable debug APK
        run: |
          ./gradlew assembleStableDebug \
            --parallel \
            --build-cache \
            --no-daemon \
            -Pandroid.enableBuildCache=true

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jca-dual-camera-debug-${{ github.sha }}
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ── Upload reports on failure ─────────────────────────────────────────────
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 3
